<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RYZN Fuel — snap to log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  :root { --accent: 145 72% 50%; }   /* re-tinted from the parent's picked theme */
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #glow {
    position: absolute; width: 72%; height: 60%;
    background: radial-gradient(ellipse 60% 70% at 50% 55%, rgba(48,209,88,0.16) 0%, rgba(69,183,209,0.05) 45%, transparent 70%);
    filter: blur(48px); pointer-events: none;
  }

  /* phone — scaled to fit the iframe via --s (set in JS) */
  .phone-scale { position: relative; z-index: 2; transform: scale(var(--s, 0.52)); transform-origin: center; }
  .phone {
    position: relative; width: 640px; height: 1300px;
    border-radius: 96px; padding: 20px; background: #1c1c1e;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6);
  }
  #screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 78px; overflow: hidden; background: #0a0d12;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  #island {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 56px; background: #000; border-radius: 999px; z-index: 40;
  }

  /* wooden-table backdrop (kept the same across every dish) */
  .fu-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .fu-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.42); z-index: 2; }

  /* the plate cutout that slides in from the left and out to the right */
  .fu-dish {
    position: absolute; left: 50%; top: 54%;
    width: 61%; height: auto;
    transform: translate(-50%, -50%);
    opacity: 0; will-change: transform, opacity; z-index: 5;
    filter: brightness(0.68) saturate(0.95) drop-shadow(0 24px 42px rgba(0,0,0,0.6));
  }

  /* ───────── Fuel UI ───────── */
  #fuel-ui { position: absolute; inset: 0; z-index: 10; }

  /* macro summary card */
  .fu-card {
    position: absolute; left: 22px; right: 22px; top: 96px;
    padding: 22px 22px 24px; border-radius: 30px;
    background: rgba(18,20,24,0.82);
    backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 0.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5); z-index: 20;
  }
  .fu-card-top { display: flex; align-items: center; justify-content: space-between; }
  .fu-water {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.12);
    color: #64d2ff; font-size: 13px; font-weight: 700;
  }
  .fu-water svg { width: 11px; height: 14px; }
  .fu-cal { display: flex; align-items: baseline; gap: 8px; }
  .fu-cal b { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; line-height: 1; }
  .fu-cal span { font-size: 15px; font-weight: 600; color: #9a9aa4; }
  .fu-chev { width: 22px; height: 22px; color: #8b8b94; }
  .fu-chev svg { width: 100%; height: 100%; }
  .fu-macros { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 0 6px; }
  .fu-macros > div { text-align: center; flex: 1; }
  .fu-macros b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fu-macros b i { font-size: 15px; font-weight: 700; font-style: normal; }
  .fu-macros span { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }
  .fu-macros .sep { flex: 0 0 1px; width: 1px; height: 40px; background: rgba(255,255,255,0.12); }

  /* scan status: apple loader + text, under the card */
  .fu-scan {
    position: absolute; left: 0; right: 0; top: 258px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 15;
  }
  .fu-apple {
    width: 46px; height: 46px;
    background-image: url("/food/apple-scan-strip.png");
    background-repeat: no-repeat; background-size: 100% 9900%; background-position-y: 0%;
    opacity: 0; will-change: transform, filter, opacity;
  }
  .fu-status {
    font-size: 17px; font-weight: 600; color: #f2f2f7;
    text-shadow: 0 1px 10px rgba(0,0,0,0.8); opacity: 0;
  }

  /* scan brackets — tinted by the selected theme accent */
  .fu-frame { position: absolute; left: 46px; right: 46px; top: 340px; bottom: 322px; opacity: 0; will-change: transform, opacity; z-index: 6; }
  .fu-c { position: absolute; width: 50px; height: 50px; border: 4px solid hsl(var(--accent)); }
  .fu-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 18px; }
  .fu-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 18px; }
  .fu-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 18px; }
  .fu-br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 18px; }

  /* capture controls row */
  .fu-controls {
    position: absolute; left: 0; right: 0; bottom: 208px;
    display: flex; align-items: center; justify-content: center; gap: 54px; z-index: 25;
  }
  .fu-side { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: #d7d7de; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
  .fu-circ {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(40,42,46,0.62); backdrop-filter: blur(10px);
    border: 0.5px solid rgba(255,255,255,0.16); display: grid; place-items: center; color: #fff;
  }
  .fu-circ svg { width: 27px; height: 27px; }
  .fu-center { position: relative; width: 100px; height: 100px; }
  .fu-cam, .fu-check {
    position: absolute; inset: 0; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 26px rgba(0,0,0,0.45); will-change: transform, opacity;
  }
  .fu-cam {
    background: rgba(40,42,46,0.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(255,255,255,0.16);
  }
  .fu-check { background: #30d158; opacity: 0; }
  .fu-cam svg { width: 42px; height: 42px; }
  .fu-check svg { width: 46px; height: 46px; }

  /* floating rounded pill navigation (inset from edges, photo shows around it) */
  .fu-tabbar {
    position: absolute; left: 50px; right: 50px; bottom: 40px; height: 92px;
    padding: 0 8px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(14,16,20,0.86); border-radius: 999px;
    backdrop-filter: blur(26px) saturate(1.3); -webkit-backdrop-filter: blur(26px) saturate(1.3);
    border: 0.5px solid rgba(255,255,255,0.10);
    box-shadow: 0 16px 40px rgba(0,0,0,0.5); z-index: 30;
  }
  .fu-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex: 1; color: #85858e; font-size: 12px; font-weight: 600; padding: 10px 0; margin: 0 4px; border-radius: 999px; }
  .fu-tab svg { width: 25px; height: 25px; }
  .fu-tab.active { color: hsl(var(--accent)); background: hsl(var(--accent) / 0.16); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="glow"></div>
    <div class="phone-scale">
      <div class="phone">
        <div id="screen">
          <div id="island"></div>

          <img class="fu-bg" src="/food/table-empty.jpg" alt="" draggable="false" />
          <div class="fu-dim"></div>
          <img class="fu-dish" src="/food/dish-cutout-v2.png" alt="" draggable="false" />

          <div id="fuel-ui">
            <div class="fu-frame">
              <span class="fu-c fu-tl"></span><span class="fu-c fu-tr"></span>
              <span class="fu-c fu-bl"></span><span class="fu-c fu-br"></span>
            </div>

            <div class="fu-scan">
              <div class="fu-apple"></div>
              <div class="fu-status">Calculating your macros...</div>
            </div>

            <div class="fu-card">
              <div class="fu-card-top">
                <div class="fu-water"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c3.4 4.3 6.5 8.1 6.5 11.7A6.5 6.5 0 0 1 12 20.7a6.5 6.5 0 0 1-6.5-6.5c0-3.6 3.1-7.4 6.5-11.7z"/></svg><span>0.5L</span></div>
                <div class="fu-cal"><b class="fu-cal-n">0</b><span>cal today</span></div>
                <div class="fu-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
              </div>
              <div class="fu-macros">
                <div><b class="fu-p" style="color:#30D158">0<i>g</i></b><span style="color:#30D158">Protein</span></div>
                <div class="sep"></div>
                <div><b class="fu-cb" style="color:#FF9F0A">0<i>g</i></b><span style="color:#FF9F0A">Carbs</span></div>
                <div class="sep"></div>
                <div><b class="fu-f" style="color:#0A84FF">0<i>g</i></b><span style="color:#0A84FF">Fat</span></div>
              </div>
            </div>

            <div class="fu-controls">
              <div class="fu-side"><div class="fu-circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 6h11M8.5 12h11M8.5 18h11"/><circle cx="4.4" cy="6" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.4" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.4" cy="18" r="1.15" fill="currentColor" stroke="none"/></svg></div><span>Logs</span></div>
              <div class="fu-center">
                <div class="fu-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4.6 7.6h2.9l1.5-2.1h6l1.5 2.1h2.9A1.6 1.6 0 0 1 21 9.2v8.6a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 17.8V9.2a1.6 1.6 0 0 1 1.6-1.6z"/><circle cx="12" cy="13.1" r="3.5"/></svg></div>
                <div class="fu-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.6L19 7.5"/></svg></div>
              </div>
              <div class="fu-side"><div class="fu-circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9.2" y="3" width="5.6" height="10.4" rx="2.8" fill="currentColor" stroke="none"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0M12 17.6V21M8.8 21h6.4"/></svg></div><span>Voice</span></div>
            </div>

            <div class="fu-tabbar">
              <div class="fu-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8.5v7M17.5 8.5v7M4 10.5v3M20 10.5v3M6.5 12h11"/></svg><span>Workout</span></div>
              <div class="fu-tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13h6l-1.5 9L19 10.5h-6z"/></svg><span>Fuel</span></div>
              <div class="fu-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg><span>Profile</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Theme hydration — read the accent the visitor picked in the parent
  // window (same origin, shared localStorage) and paint the same H S% L%
  // triplet into --accent so the scan brackets + active Fuel tab re-tint
  // in lockstep with the rest of the site. Listen for `storage` too so a
  // fresh pick updates this iframe live without a reload.
  (function () {
    var THEMES = {
      emerald: '145 72% 50%', coral: '10 78% 55%', ocean: '210 64% 46%',
      blush: '340 65% 57%', gold: '45 75% 53%', violet: '270 47% 52%'
    };
    function apply(key) {
      var v = THEMES[key];
      if (v) document.documentElement.style.setProperty('--accent', v);
    }
    try { apply(localStorage.getItem('ryzn-theme')); } catch (_) {}
    window.addEventListener('storage', function (e) {
      if (e.key === 'ryzn-theme') apply(e.newValue);
    });
  })();

  // five dishes rotate through: slide in from left → scan for macros → slide out right → next
  // four meals across a healthy day — totals land around 2,400 cal
  const DISHES = [
    { img: "/food/dish-cutout-v2.png", cal: 640, p: 56, c: 62, f: 18 }, // chicken grain bowl
    { img: "/food/steak-plate.png",    cal: 690, p: 54, c: 34, f: 38 }, // steak plate
    { img: "/food/fruit-bowl.png",     cal: 430, p: 24, c: 60, f: 11 }, // fruit & yogurt bowl
    { img: "/food/tuna-bowl.png",      cal: 640, p: 48, c: 54, f: 23 }, // seared tuna bowl
  ];
  // preload so the swap at each cycle boundary never flashes
  DISHES.forEach((d) => { const im = new Image(); im.src = d.img; });

  // running cumulative totals — the top card ADDS each plate on top of the last,
  // building the day's total across all five, then resets to zero at the end.
  let run = { cal: 0, p: 0, c: 0, f: 0 };
  DISHES.forEach((d) => {
    d.s = { cal: run.cal, p: run.p, c: run.c, f: run.f };
    run.cal += d.cal; run.p += d.p; run.c += d.c; run.f += d.f;
    d.e = { cal: run.cal, p: run.p, c: run.c, f: run.f };
  });
  const TOTAL = { cal: run.cal, p: run.p, c: run.c, f: run.f };

  const q = (s) => document.querySelector(s);
  const fu = {
    dish: q(".fu-dish"), frame: q(".fu-frame"), apple: q(".fu-apple"), status: q(".fu-status"),
    calN: q(".fu-cal-n"), pN: q(".fu-p"), cbN: q(".fu-cb"), fN: q(".fu-f"),
    cam: q(".fu-cam"), check: q(".fu-check"),
  };

  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const win = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInCubic = (t) => t * t * t;
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const springEase = (t) => (t >= 1 ? 1 : 1 - Math.pow(1 - t, 3));

  // per-dish sub-beats (fractions of one CYCLE)
  const IN_E = 0.18;    // plate finished sliding in
  const SC_S = 0.22, SC_E = 0.52;   // scanning + macro count-up
  const HOLD_E = 0.82;  // result held; plate starts sliding out
  const CYCLE = 5200;   // ms per dish
  const FREEZE = 1500;  // ms of empty screen at the end before the total drops to zero
  const SEQ = DISHES.length * CYCLE;
  const PERIOD = SEQ + FREEZE;

  function setMacros(cal, p, c, f) {
    fu.calN.textContent = Math.round(cal).toLocaleString();
    fu.pN.innerHTML = Math.round(p) + "<i>g</i>";
    fu.cbN.innerHTML = Math.round(c) + "<i>g</i>";
    fu.fN.innerHTML = Math.round(f) + "<i>g</i>";
  }

  function fit() {
    const s = q(".phone-scale");
    const pad = 24;
    const scale = Math.min((window.innerWidth - pad) / 640, (window.innerHeight - pad) / 1300);
    s.style.setProperty("--s", scale.toFixed(4));
  }
  window.addEventListener("resize", fit);
  fit();

  let curIdx = -1, dish = DISHES[0];
  const start = performance.now();

  function frame(now) {
    const elapsed = now - start;
    const tt = elapsed % PERIOD;

    // ── FREEZE beat: after the 5th plate, screen sits empty holding the grand total,
    //    then the total counts back down to zero and the loop restarts. ──
    if (tt >= SEQ) {
      const fp = (tt - SEQ) / FREEZE;                       // 0..1 through the freeze
      const v = 1 - easeInOutCubic(win(fp, 0.42, 1));       // hold, then drop to 0
      setMacros(TOTAL.cal * v, TOTAL.p * v, TOTAL.c * v, TOTAL.f * v);
      fu.dish.style.opacity = "0";
      fu.frame.style.opacity = "0";
      fu.apple.style.opacity = "0";
      fu.status.style.opacity = "0";
      fu.cam.style.opacity = "1";
      fu.check.style.opacity = "0";
      curIdx = -1;                                          // force src reset next loop
      requestAnimationFrame(frame);
      return;
    }

    const idx = Math.floor(tt / CYCLE);
    const lp = (tt % CYCLE) / CYCLE;                // 0..1 within this dish

    if (idx !== curIdx) { curIdx = idx; dish = DISHES[idx]; fu.dish.src = dish.img; }

    // ── PLATE slide: starts fully OUTSIDE the phone (left), decelerates to center,
    //    holds, then accelerates fully OUTSIDE to the right. -195%/+195% clears the frame. ──
    let x;
    if (lp < IN_E) {
      x = lerp(-195, 0, easeOutCubic(lp / IN_E));
    } else if (lp < HOLD_E) {
      x = 0;
    } else {
      x = lerp(0, 195, easeInCubic((lp - HOLD_E) / (1 - HOLD_E)));
    }
    fu.dish.style.opacity = "1";
    fu.dish.style.transform = "translate(-50%, -50%) translateX(" + x.toFixed(1) + "%)";

    // ── SCAN brackets: snap on after arrival, fade before exit ──
    const frIn = springEase(win(lp, IN_E, IN_E + 0.10));
    const frOut = 1 - win(lp, HOLD_E - 0.06, HOLD_E);
    fu.frame.style.opacity = String(clamp01(frIn * 2) * frOut);
    fu.frame.style.transform = "scale(" + lerp(1.14, 1, frIn).toFixed(4) + ")";

    // apple loader + status pulse during the scan
    const scanOut = 1 - win(lp, SC_E, SC_E + 0.06);
    const appleIn = easeOutCubic(win(lp, SC_S, SC_S + 0.06));
    const glow = Math.sin(Math.PI * win(lp, SC_S, SC_E));
    fu.apple.style.opacity = String(appleIn * scanOut);
    fu.apple.style.transform = "scale(" + (1 + 0.14 * glow).toFixed(3) + ")";
    const appleFrame = Math.floor(Math.max(0, tt - SC_S * CYCLE) / 40) % 99;
    fu.apple.style.backgroundPositionY = ((appleFrame / 98) * 100).toFixed(3) + "%";
    fu.apple.style.filter = glow > 0.01
      ? "drop-shadow(0 0 " + (10 * glow).toFixed(1) + "px hsl(var(--accent) / 0.95)) drop-shadow(0 0 " + (24 * glow).toFixed(1) + "px hsl(var(--accent) / 0.5))"
      : "";
    const stIn = easeOutCubic(win(lp, SC_S + 0.02, SC_S + 0.08));
    fu.status.style.opacity = String(stIn * scanOut * (0.72 + 0.28 * Math.sin(now * 0.007)));

    // ── MACROS accumulate: animate from the running total up by this plate's amount ──
    const acc = easeOutCubic(win(lp, SC_S, SC_E));
    setMacros(
      lerp(dish.s.cal, dish.e.cal, acc),
      lerp(dish.s.p, dish.e.p, acc),
      lerp(dish.s.c, dish.e.c, acc),
      lerp(dish.s.f, dish.e.f, acc)
    );

    // ── capture button: gray camera → green check once scanned ──
    const swapK = easeInOutCubic(win(lp, SC_E, SC_E + 0.06)) * (1 - win(lp, HOLD_E, HOLD_E + 0.04));
    fu.cam.style.opacity = String(1 - swapK);
    fu.check.style.opacity = String(swapK);
    fu.check.style.transform = "scale(" + lerp(0.7, 1, springEase(swapK)).toFixed(3) + ")";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
